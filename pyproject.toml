[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "durabletask"
version = "1.13.1"
description = "A Durable Task Client SDK for Python"
keywords = [
    "durable",
    "task",
    "workflow"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.11"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = [
    "grpcio",
    "protobuf",
    "packaging"
]

[project.optional-dependencies]
opentelemetry = [
    "opentelemetry-api>=1.0.0",
    "opentelemetry-sdk>=1.0.0"
]
azure-blob-payloads = [
    "azure-storage-blob[aio]>=12.0.0"
]
history-export-azure = [
    "azure-storage-blob[aio]>=12.0.0"
]

[project.urls]
repository = "https://github.com/microsoft/durabletask-python"
changelog = "https://github.com/microsoft/durabletask-python/blob/main/CHANGELOG.md"

# Development tools only: runtime dependencies belong in each package's metadata.
[dependency-groups]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]
lint = [
    "autopep8",
    "flake8",
    "pymarkdownlnt",
]
typecheck = [
    "pyright",
]
build = [
    "build",
]
protobuf = [
    "grpcio-tools",
]
nox = [
    "nox>=2025.2.9",
]
examples = [
    "pydantic>=2",
    "opentelemetry-exporter-otlp-proto-grpc",
]
functions-e2e = [
    {include-group = "test"},
    "opentelemetry-exporter-otlp-proto-grpc",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "typecheck"},
    {include-group = "build"},
    {include-group = "protobuf"},
    {include-group = "nox"},
    {include-group = "examples"},
]

[tool.setuptools.packages.find]
include = ["durabletask", "durabletask.*"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "azurite: tests that require Azurite (local Azure Storage emulator)",
    "functions_e2e: end-to-end tests that require the Azure Functions Core Tools (func) and Azurite",
]
