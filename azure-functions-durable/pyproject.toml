[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-functions-durable"
version = "2.0.0b1"
description = "Durable Task Python SDK provider implementation for Durable Azure Functions"
keywords = [
    "durable",
    "task",
    "workflow",
    "azure",
    "azure functions"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.13"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = [
    "durabletask>=1.2.0dev0",
    "azure-identity>=1.19.0",
    "azure-functions>=2.2.0b6",
    "typing-extensions>=4.9.0"
]

[project.urls]
repository = "https://github.com/microsoft/durabletask-python"
changelog = "https://github.com/microsoft/durabletask-python/blob/main/azure-functions-durable/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["azure.durable_functions", "azure.durable_functions.*"]

[tool.pytest.ini_options]
minversion = "6.0"
